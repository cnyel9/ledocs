name: Debug Key
on: workflow_dispatch
jobs:
  dbg:
    runs-on: ubuntu-24.04
    steps:
      - name: Cek baca kunci privat
        env:
          KEYSTORE_BASE64: ${{ secrets.LEDOCS_UPLOAD_STORE_FILE_BASE64 }}
          SP: ${{ secrets.LEDOCS_UPLOAD_STORE_PASSWORD }}
          KP: ${{ secrets.LEDOCS_UPLOAD_KEY_PASSWORD }}
          AL: ${{ secrets.LEDOCS_UPLOAD_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/k.p12
          if keytool -certreq -keystore /tmp/k.p12 -alias "$AL" -storepass "$SP" -keypass "$KP" -file /tmp/out.csr 2>/tmp/err.txt; then
            echo "CERTREQ OK: kunci privat terbaca di runner"
          else
            echo "CERTREQ GAGAL:"; cat /tmp/err.txt
          fi
          rm -f /tmp/k.p12 /tmp/out.csr
