name: Laporan bug
description: Laporkan masalah yang bisa direproduksi di LeDocs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah membantu memperbaiki LeDocs. Hapus isi dokumen pribadi, data personal, dan token akses dari tangkapan layar atau log yang Anda lampirkan.
  - type: input
    id: version
    attributes:
      label: Versi LeDocs
      description: Lihat di Pengaturan, bagian Tentang, atau di halaman rilis.
      placeholder: "0.0.1"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Dari mana Anda memasang LeDocs?
      options:
        - APK rilis GitHub
        - Google Play
        - Dibangun dari source
        - Lainnya / tidak yakin
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Model perangkat
      placeholder: "Redmi 14C"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Versi Android
      placeholder: "Android 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: "1. Buka … 2. Ketuk … 3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang diharapkan
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Perilaku yang terjadi
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Tangkapan layar atau log
      description: Opsional. Samarkan nama, jalur berkas, isi dokumen, dan token sebelum melampirkan.
